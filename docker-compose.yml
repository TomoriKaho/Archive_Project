services:
  postgres:
    networks:
     - archive_net
    image: postgres:15
    container_name: archive-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    networks:
     - archive_net
    image: qdrant/qdrant:latest
    container_name: archive-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  qdrant_init:
    networks:
     - archive_net
    image: curlimages/curl:8.11.1
    container_name: archive-qdrant-init
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts:ro
    command: sh /scripts/qdrant_init.sh
    depends_on:
      - qdrant

  ollama:
    networks:
     - archive_net
    image: ollama/ollama:latest
    container_name: archive-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  ollama_pull:
    networks:
     - archive_net
    image: ollama/ollama:latest
    container_name: archive-ollama-pull
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./scripts:/scripts:ro
      - ollama_data:/root/.ollama
    command: sh /scripts/ollama_pull_models.sh
    depends_on:
      - ollama

  backend:
    networks:
     - archive_net
    image: archive-backend:2026-01-10
    container_name: archive-backend
    env_file:
      - .env
    volumes:
      - /opt/Archive_Project/migrations/versions/beb055932c98_domains_add_language.py:/app/migrations/versions/beb055932c98_domains_add_language.py:ro
      - /opt/Archive_Project/app/api/chats.py:/app/app/api/chats.py:ro
    depends_on:
      - ollama
      - postgres
      - qdrant
    ports:
      - "18000:18000"


  frontend_admin:
    networks:
     - archive_net
    image: nginx:alpine
    container_name: archive-frontend-admin
    ports:
      - "8080:80"
    volumes:
      - ./frontend_admin/dist:/usr/share/nginx/html:ro
      - ./nginx_admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend_client:
    networks:
     - archive_net
    image: nginx:alpine
    container_name: archive-frontend-client
    ports:
      - "8081:80"
    volumes:
      - ./frontend_client/dist:/usr/share/nginx/html:ro
      - ./nginx_client.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      
  gateway:
    networks:
     - archive_net
    image: nginx:alpine
    container_name: archive-gateway
    ports:
      - "80:80"
    volumes:
      - /opt/Archive_Project/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/Archive_Project/frontend_client/dist:/usr/share/nginx/html/client:ro
      - /opt/Archive_Project/frontend_admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - backend


volumes:
  postgres_data:
  qdrant_storage:
  ollama_data:

networks:
  archive_net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
        - subnet: "fd00:2026:0128::/64"
