services:
  postgres:
    image: postgres:15
    container_name: archive-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: archive-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"

  qdrant_init:
    image: curlimages/curl:8.11.1
    container_name: archive-qdrant-init
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts:ro
    command: sh /scripts/qdrant_init.sh
    depends_on:
      - qdrant

  ollama:
    image: ollama/ollama:latest
    container_name: archive-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  ollama_pull:
    image: ollama/ollama:latest
    container_name: archive-ollama-pull
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./scripts:/scripts:ro
      - ollama_data:/root/.ollama
    command: sh /scripts/ollama_pull_models.sh
    depends_on:
      - ollama

  backend:
    image: python:3.11-slim
    container_name: archive-backend
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./:/app
    command: >
      sh -c "pip install --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt && \
             alembic upgrade head && \
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - ollama
      - ollama_pull
      - postgres
      - qdrant
      - qdrant_init
    ports:
      - "18000:8000"

  frontend_admin:
    image: node:18
    container_name: archive-frontend-admin
    working_dir: /app/frontend_admin
    volumes:
      - ./frontend_admin:/app/frontend_admin
      - ./frontend_shared:/app/frontend_shared
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install && npm run serve -- --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    depends_on:
      - backend

  frontend_client:
    image: node:18
    container_name: archive-frontend-client
    working_dir: /app/frontend_client
    volumes:
      - ./frontend_client:/app/frontend_client
      - ./frontend_shared:/app/frontend_shared
    command: sh -c "npm config set registry https://registry.npmmirror.com && npm install && npm run serve -- --host 0.0.0.0"
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_storage:
  ollama_data: