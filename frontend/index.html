<!DOCTYPE html>
<!-- 声明文档类型为 HTML5，确保浏览器以标准模式渲染 -->
<html lang="zh-CN">
<!-- 设置页面使用中文，方便屏幕阅读器识别语言 -->
<head>
  <!-- 指定字符集为 UTF-8，保证中文显示正常 -->
  <meta charset="UTF-8">
  <!-- 让页面在移动端具备良好的缩放表现 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 页面标题，用于浏览器标签显示 -->
  <title>Archive Project 控制台</title>
  <!-- 引入全局样式文件，type=\"text/css\" 可省略但显式更清晰 -->
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <!-- 页面根容器，包裹整个单页应用的布局 -->
  <div class="app-shell">
    <!-- 左侧导航栏，提供主要页面的入口 -->
    <nav class="sidebar" aria-label="主导航">
      <!-- 应用 Logo 与名称区域 -->
      <div class="sidebar__brand">Archive 控制台</div>
      <!-- 导航链接列表，使用按钮避免页面跳转 -->
      <ul class="sidebar__menu" id="sidebar-menu">
        <!-- 各行导航项将由 app.js 动态填充，保持路由同步 -->
      </ul>
    </nav>
    <!-- 主内容区域，包含顶部工具栏与实际页面内容 -->
    <div class="main">
      <!-- 顶部工具栏显示当前用户信息与操作按钮 -->
      <header class="topbar" aria-label="页面工具栏">
        <!-- 左侧标题区域，通过 app.js 注入当前页面名称 -->
        <div class="topbar__title" id="topbar-title">Archive 控制台</div>
        <!-- 右侧用户操作区域，包括用户信息与登出按钮 -->
        <div class="topbar__actions" id="topbar-actions"></div>
      </header>
      <!-- 内容容器，视图模块会在此 mount -->
      <main class="content" id="app-view" tabindex="-1">
        <!-- 初始加载状态，JS 会在视图渲染后移除 -->
        <div class="loading-placeholder">正在加载界面...</div>
      </main>
    </div>
  </div>
  <!-- Toast 容器，app.js 会懒加载创建，但提前写能帮助无 JS 时显示 -->
  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
  <!-- 引入主入口脚本，使用 ES Module 以便拆分模块 -->
  <script type="module" src="./assets/app.js"></script>
</body>
</html>
