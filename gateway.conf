server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  # Docker 内置 DNS（让 proxy_pass 用变量时能运行时解析）
  resolver 127.0.0.11 ipv6=off valid=30s;

  #
  # Backend
  #

  # compat: /api -> /api/
  location = /api { return 301 /api/; }

  # /api/* -> backend (keep /api prefix)
  location ^~ /api/ {
    set $up_backend backend:18000;
    proxy_pass http://$up_backend;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /archive-api -> /archive-api/
  location = /archive-api { return 301 /archive-api/; }

  # /archive-api/* -> backend (strip /archive-api prefix)
  # NOTE: 不用变量，避免 proxy_pass+rewrite 的 500 坑
  location ^~ /archive-api/ {
    proxy_pass http://backend:18000/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }


  #
  # Root redirect
  #
  location = / { return 302 /archive/; }

  #
  # Client (strip /archive prefix)
  #
  location = /archive { return 301 /archive/; }
  location ^~ /archive/ {
    rewrite ^/archive/(.*)$ /$1 break;
    proxy_pass http://frontend_client;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  #
  # Admin (strip /archive-admin prefix)
  #
  location = /archive-admin { return 301 /archive-admin/; }
  location ^~ /archive-admin/ {
    rewrite ^/archive-admin/(.*)$ /$1 break;
    proxy_pass http://frontend_admin;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
